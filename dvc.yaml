stages:
  ingest:
    cmd: python -m machinepulse.data.ingest --config configs/data.yaml
    deps:
    - configs/data.yaml
    - src/machinepulse/config.py
    - src/machinepulse/data/ingest.py
    outs:
    - data/raw
  validate:
    cmd: python -m machinepulse.data.validate --config configs/data.yaml
    deps:
    - configs/data.yaml
    - data/raw
    - src/machinepulse/config.py
    - src/machinepulse/data/validate.py
    outs:
    - reports/metrics/data_validation.json
  preprocess:
    cmd: python -m machinepulse.data.preprocess --config configs/preprocess.yaml
    deps:
    - configs/preprocess.yaml
    - data/raw
    - src/machinepulse/config.py
    - src/machinepulse/data/preprocess.py
    outs:
    - data/processed/tabular
    - reports/metrics/preprocessing.json
  sequences:
    cmd: python -m machinepulse.data.sequences --config configs/preprocess.yaml
    deps:
    - configs/preprocess.yaml
    - data/processed/tabular
    - src/machinepulse/config.py
    - src/machinepulse/data/sequences.py
    outs:
    - data/processed/sequences
    - reports/metrics/sequences.json
  baseline:
    cmd: python -m machinepulse.models.baseline --config configs/models.yaml 
      --tracking-config configs/tracking.yaml
    deps:
    - configs/models.yaml
    - configs/tracking.yaml
    - data/processed/tabular
    - src/machinepulse/config.py
    - src/machinepulse/models/baseline.py
    - src/machinepulse/models/evaluation.py
    - src/machinepulse/tracking.py
    outs:
    - models/baseline
    - reports/figures/baseline
    metrics:
    - reports/metrics/baseline.json
