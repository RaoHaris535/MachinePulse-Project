preprocessing:
  input_path: data/raw/MetroPT3(AirCompressor).csv
  output_dir: data/processed/tabular
  report_path: reports/metrics/preprocessing.json
  timestamp_column: timestamp
  resample_rule: 5min
  csv_index_columns:
    - index
    - "Unnamed: 0"
  analog_features:
    - TP2
    - TP3
    - H1
    - DV_pressure
    - Reservoirs
    - Oil_temperature
    - Motor_current
  digital_features:
    - COMP
    - DV_eletric
    - Towers
    - MPG
    - LPS
    - Pressure_switch
    - Oil_level
    - Caudal_impulses
  split:
    train_end: "2020-05-31 23:59:59"
    validation_end: "2020-06-30 23:59:59"
  warning_horizon_minutes: 60
  failure_events:
    - id: failure_01
      start: "2020-04-18 00:00:00"
      end: "2020-04-18 23:59:59"
      type: air_leak
    - id: failure_02
      start: "2020-05-29 23:30:00"
      end: "2020-05-30 06:00:00"
      type: air_leak
    - id: failure_03
      start: "2020-06-05 10:00:00"
      end: "2020-06-07 14:30:00"
      type: air_leak
    - id: failure_04
      start: "2020-07-15 14:30:00"
      end: "2020-07-15 19:00:00"
      type: air_leak

sequences:
  input_dir: data/processed/tabular
  output_dir: data/processed/sequences
  report_path: reports/metrics/sequences.json
  window_rows: 12
  stride_rows: 1
  expected_interval_minutes: 5
  train_normal_only: true
